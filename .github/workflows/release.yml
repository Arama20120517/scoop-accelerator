name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write
    if: github.actor != 'renovate[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: scoop-accelerator.psm1
          generate_release_notes: true

      - name: Update manifest
        id: update
        run: |
          $path = "${{ github.workspace }}\bucket\scoop-accelerator.json"

          $manifest = Get-Content $path -Raw | ConvertFrom-Json

          $manifest.version = "${{ github.ref_name }}" -replace '^v', ''
          $manifest.url = "https://gitee.com/arama0517/scoop-accelerator/releases/download/${{ github.ref_name }}/scoop-accelerator.psm1"
          $manifest.hash = (Get-FileHash -Path "${{ github.workspace }}\scoop-accelerator.psm1" -Algorithm SHA256).Hash.ToLower()

          $manifest | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding UTF8

          Write-Host "sha=$(git rev-parse HEAD)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(manifest): update to ${{ github.ref_name }}"
